<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff1ff" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#8fd3ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4e8ef0" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipGlass"><rect x="40" y="40" width="520" height="520" rx="24"/></clipPath>
  </defs>
  <rect x="40" y="40" width="520" height="520" rx="24" fill="url(#glassFill)" stroke="#eaf6ff" stroke-opacity="0.7" stroke-width="2.5"/>
  <g clip-path="url(#clipGlass)">
    <polygon points="40,40 320,40 40,320" fill="url(#glassShine)"/>
    <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1">
      <line x1="40" y1="170" x2="560" y2="170"/>
      <line x1="40" y1="300" x2="560" y2="300"/>
      <line x1="40" y1="430" x2="560" y2="430"/>
      <line x1="170" y1="40" x2="170" y2="560"/>
      <line x1="300" y1="40" x2="300" y2="560"/>
      <line x1="430" y1="40" x2="430" y2="560"/>
    </g>
  </g>
</svg>
